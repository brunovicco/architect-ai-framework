[project]
name = "arquiteto-ai-framework"
version = "0.2.0"
description = "Vendor-neutral decision framework for AI/LLM architecture using the ARQUITETO method."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "pydantic>=2.8",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # long natural-language strings (i18n, exported docs) are expected

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]  # sys.path is set up before importing the local package

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
